<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Social</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0f172a] text-white">

    <!-- 1. LOGIN SCREEN (Hidden if logged in) -->
    <div id="loginScreen" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl">
            <h1 class="text-3xl font-bold text-center text-blue-500 mb-2">Nexus</h1>
            <p class="text-center text-slate-400 mb-8 text-sm">Enter details to join the network</p>
            <input type="text" id="userName" placeholder="Full Name" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl mb-4 outline-none focus:border-blue-500">
            <button id="joinBtn" class="w-full bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-bold transition">Join Nexus</button>
        </div>
    </div>

    <!-- 2. MAIN FEED -->
    <header class="p-4 border-b border-slate-800 sticky top-0 bg-[#0f172a]/80 backdrop-blur-md z-40">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h2 class="text-xl font-black italic text-blue-500 tracking-tighter">NEXUS</h2>
            <div id="profileTag" class="text-xs bg-slate-800 px-3 py-1 rounded-full border border-slate-700"></div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto p-4 pb-24" id="feedContainer">
        <!-- Posts will appear here -->
        <div class="text-center py-20 text-slate-500">Connecting to feed...</div>
    </main>

    <!-- 3. POST BUTTON (+) -->
    <button id="openModal" class="fixed bottom-6 right-6 w-14 h-14 bg-blue-600 rounded-full shadow-lg shadow-blue-500/40 flex items-center justify-center text-2xl z-50 hover:scale-110 active:scale-95 transition">
        <i class="fas fa-plus"></i>
    </button>

    <!-- 4. CREATE POST MODAL (Hidden by default) -->
    <div id="postModal" class="fixed inset-0 z-[60] bg-black/80 backdrop-blur-sm hidden flex items-end md:items-center justify-center p-4">
        <div class="w-full max-w-lg bg-slate-800 rounded-t-3xl md:rounded-3xl p-6 border border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold">New Post</h3>
                <button id="closeModal" class="text-slate-400"><i class="fas fa-times"></i></button>
            </div>
            <textarea id="postContent" placeholder="What's happening?" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl h-32 outline-none resize-none mb-4"></textarea>
            <button id="submitPost" class="w-full bg-blue-600 p-4 rounded-xl font-bold">Post to Nexus</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
